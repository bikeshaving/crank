name: Crank CI Workflow
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build

  skill:
    name: Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run skill
      # The .skill zip embeds timestamps, so only the flat output is diffable
      - run: git diff --exit-code -- skills ':(exclude)skills/*.skill'

  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run core tests
        run: bunx libuild test test/ --platform ${{ matrix.browser }}
      - name: Run eslint plugin tests
        run: bun run test:eslint

  changes:
    name: Detect Changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.check.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '^(website|docs|examples)/|^(package\.json|SKILL\.md|CHANGELOG\.md)$'; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Website
    needs: [lint, typecheck, build, test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run build
        working-directory: packages/crankdown
      # bun 1.4 snapshots file: folder dependencies at install time, so the
      # install must be refreshed after the dist directories are built
      - run: bun install --force
      - run: bun install
        working-directory: website
      - name: Install Bikeshed
        run: pipx install bikeshed && bikeshed update
      - name: Build skill archive
        run: npx @b9g/skillpack SKILL.md -o skills/
      - name: Deploy website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          bun run deploy
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
